# SLAM Toolbox configuration for TurtleBot3 with LDS-01
# Modeled after cartographer's turtlebot3_lds_2d.lua

slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_scan_data: true

    # Mode
    mode: mapping  # 'mapping' for SLAM, 'localization' for loading a saved map

    # Map settings
    resolution: 0.05
    max_laser_range: 3.5
    minimum_time_interval: 0.5

    # Transformations
    transform_publish_period: 0.02
    map_update_interval: 2.0

    # Scan matcher parameters (corresponds to Cartographer's scan matching)
    use_scan_matching: true
    use_scan_barycenter: true
    match_min_dist: 0.5
    match_max_angle_error: 0.5
    match_max_angle_cosine: 0.9
    match_max_translation_error: 0.5

    # Correlative scan matcher
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smoothing_deviation: 0.03

    # Loop closure
    loop_closure_enabled: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_score_coarse: 0.55
    loop_match_search_window_dimension: 10.0
    loop_match_resolution: 0.05
    loop_match_minimum_score_fine: 0.6
    loop_match_translation_variance_percent: 0.05
    loop_match_angle_variance_percent: 0.05

    # Scan matcher fine parameters
    linear_search_window: 0.5
    angular_search_window: 0.18  # ~10 degrees

    # General SLAM parameters
    enable_interactive_mode: true
    debug_logging: false
    use_sim_time: false
